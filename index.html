<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Puzzle Clear</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="letterbox">
      <div id="phone-frame">
        <div id="stage" aria-hidden="true"></div>
        <div id="hud">
          <header class="game-header">
            <div class="score-center">
              <div class="main-score" data-game-score aria-label="puzzle level">1</div>
            </div>
            <p id="status" class="status status-debug" hidden></p>
            <p class="phase" data-game-phase hidden>M2</p>
          </header>
        </div>

        <div class="level-editor" data-level-editor hidden>
          <div class="level-editor-title">Editor</div>
          <div class="level-editor-actions">
            <button type="button" data-editor-copy>Copy Mask</button>
            <button type="button" data-editor-clear>Clear</button>
            <button type="button" data-editor-fill>Fill</button>
          </div>
          <textarea data-editor-mask spellcheck="false" readonly></textarea>
        </div>

        <!-- 死亡开场闪红（盖住盘面，不挡结算） -->
        <div class="death-flash" data-death-flash aria-hidden="true"></div>

        <!-- 全屏结算：盖住 stage + hud -->
        <div class="game-over" data-game-over hidden aria-hidden="true">
          <div class="game-over-inner">
            <div class="game-over-copy">
              <p class="game-over-title">Puzzle Clear</p>
              <p class="game-over-score-label">Level</p>
              <p class="game-over-score">
                <span data-final-score>0</span>
              </p>
            </div>
            <button type="button" class="restart-btn" data-restart>Restart</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
